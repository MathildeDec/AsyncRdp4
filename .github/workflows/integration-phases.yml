name: Suivi des phases d'intégration

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, closed, reopened]
  workflow_dispatch:

permissions:
  issues: read
  pull-requests: read
  contents: read

jobs:
  rapport-phases:
    name: Rapport d'avancement par phase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les fichiers de suivi
        run: |
          echo "## Vérification des fichiers de suivi" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in docs/roadmap.md docs/issues-summary.md docs/features-backlog.md; do
            if [ -f "$f" ]; then
              echo "✅ \`$f\` présent" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️ \`$f\` manquant" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Compter les issues et générer le rapport
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: openIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              });

              const { data: closedIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                per_page: 100
              });

              // Détecter les labels de priorité présents
              const allLabels = new Set();
              for (const i of openIssues) {
                for (const l of i.labels) allLabels.add(l.name);
              }

              const priorityLabels = ['P0-fondations', 'P1-différenciation', 'P2-exploitation', 'P3-applicatif', 'P4-admin', 'haute', 'moyenne', 'faible', 'bloqué', 'décision-produit'];
              const priorityCounts = {};
              for (const label of priorityLabels) {
                priorityCounts[label] = openIssues.filter(i => i.labels.some(l => l.name === label)).length;
              }

              const diffLabels = ['diff-1-faible', 'diff-2-moyenne', 'diff-3-notable', 'diff-4-elevee', 'diff-5-expert'];
              const diffCounts = {};
              for (const label of diffLabels) {
                diffCounts[label] = openIssues.filter(i => i.labels.some(l => l.name === label)).length;
              }

              const noPriority = openIssues.filter(i =>
                !i.labels.some(l => priorityLabels.includes(l.name))
              );

              let prs = [];
              try {
                const prResult = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open'
                });
                prs = prResult.data;
              } catch (e) {
                core.warning('Impossible de lister les PRs: ' + e.message);
              }

              const summary = [
                `## Rapport d'avancement — ${context.repo.owner}/${context.repo.repo}`,
                ``,
                `**Date** : ${new Date().toISOString()}`,
                `**Déclencheur** : ${context.eventName}`,
                ``,
                `### Vue d'ensemble`,
                ``,
                `| Métrique | Valeur |`,
                `|----------|--------|`,
                `| Issues ouvertes | ${openIssues.length} |`,
                `| Issues closes | ${closedIssues.length} |`,
                `| PRs ouvertes | ${prs.length} |`,
                ``
              ];

              // Section priorité (uniquement si des labels correspondent)
              const activePriorities = priorityLabels.filter(l => priorityCounts[l] > 0);
              if (activePriorities.length > 0) {
                summary.push(`### Issues ouvertes par priorité`, ``, `| Priorité | Nombre |`, `|----------|--------|`);
                for (const l of activePriorities) {
                  summary.push(`| ${l} | ${priorityCounts[l]} |`);
                }
                summary.push(`| Sans priorité | ${noPriority.length} |`, ``);
              }

              // Section difficulté (uniquement si des labels correspondent)
              const activeDiffs = diffLabels.filter(l => diffCounts[l] > 0);
              if (activeDiffs.length > 0) {
                summary.push(`### Issues ouvertes par difficulté`, ``, `| Difficulté | Nombre |`, `|------------|--------|`);
                for (const l of activeDiffs) {
                  summary.push(`| ${l} | ${diffCounts[l]} |`);
                }
                summary.push(``);
              }

              if (noPriority.length > 0) {
                summary.push(`### Issues sans priorité`, ``, ...noPriority.map(i => `- #${i.number}: ${i.title}`), ``);
              }

              if (prs.length > 0) {
                summary.push(`### PRs ouvertes`, ``, ...prs.map(p => `- #${p.number}: ${p.title} (${p.head.ref})`), ``);
              }

              core.summary.addRaw(summary.join('\n'));
              core.summary.write();
            } catch (error) {
              core.setFailed('Erreur lors de la génération du rapport: ' + error.message);
            }
